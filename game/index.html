<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle &amp; Serve — a cooking game</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage">
  <canvas id="game" width="1280" height="800" aria-label="Sizzle and Serve cooking game"></canvas>
